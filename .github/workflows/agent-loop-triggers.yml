name: Codex agent loop

# Cloud executes the model work. Separate, short-lived publisher jobs own the
# GitHub write token and apply only validated Cloud diffs. The merge lane uses
# the same boundary: Cloud supplies a read-only gate result, then the trusted
# Action publisher performs the guarded merge.
on:
  repository_dispatch:
    types: [codex-cloud-run]
  schedule:
    - cron: "*/5 * * * *"
  issues:
    types: [labeled]
  workflow_run:
    workflows: ["Rust", "PR Metadata"]
    types: [completed]

# Serialize every run of this workflow for this repository. The lock covers
# selection, Cloud execution, and the trusted publisher together, so a
# schedule/event/dispatch run cannot submit a second task while the first run
# is still active. A queued run remains available for the next turn.
concurrency:
  group: codex-cloud-agent-loop-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-issue:
    name: Select one ready issue
    if: >-
      ${{ github.repository == 'nerdchanii/rpm' &&
          ((github.event_name == 'repository_dispatch' &&
            github.actor == 'nerdchanii' &&
            github.ref == 'refs/heads/main' &&
            (github.event.client_payload.lane == 'all' ||
             github.event.client_payload.lane == 'issue')) ||
           (vars.CODEX_CLOUD_AUTOMATION_ENABLED == 'true' &&
            (github.event_name == 'schedule' ||
             (github.event_name == 'issues' &&
              github.event.action == 'labeled' &&
              github.actor == 'nerdchanii' &&
              github.event.label.name == 'agent:ready')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: codex-cloud-issue-selector-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      issue: ${{ steps.select.outputs.issue }}
      base_ref: ${{ steps.select.outputs.base_ref }}
      base_sha: ${{ steps.select.outputs.base_sha }}
    steps:
      - id: select
        name: Select the lowest numbered ready issue and current base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          write_no_selection() {
            printf '%s\n' \
              'selected=false' 'issue=' 'base_ref=' 'base_sha=' >>"$GITHUB_OUTPUT"
          }

          # Read the complete open lifecycle queue before considering any ready
          # candidate. This keeps the Action selector aligned with the Cloud
          # queue contract and prevents main drift from a second implementation.
          issues_json="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 1000 \
            --json number,labels)"
          jq -e '
            type == "array" and
            all(.[]; type == "object" and
              (.number | type == "number" and floor == . and . > 0) and
              (.labels | type == "array" and
                all(.[]; type == "object" and (.name | type == "string"))))
          ' <<<"$issues_json" >/dev/null || {
            echo '::error title=Invalid issue queue::The open issue response is malformed.'
            write_no_selection
            exit 1
          }
          if [ "$(jq 'length' <<<"$issues_json")" -ge 1000 ]; then
            echo '::error title=Incomplete issue queue::The open issue inventory reached the 1000-item limit and may be truncated; no issue was selected.'
            write_no_selection
            echo 'selection=blocked reason=issue-inventory-may-be-truncated' >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          queue_states="$(jq -c '
            map({
              number,
              states: [ .labels[]?.name | select(
                . == "agent:research" or
                . == "agent:ready" or
                . == "agent:claimed" or
                . == "agent:review-pending" or
                . == "agent:awaiting-merge" or
                . == "agent:blocked"
              ) ] | sort
            })
          ' <<<"$issues_json")"
          invalid_lifecycle="$(jq -c '[.[] | select((.states | length) > 1)]' <<<"$queue_states")"
          if [ "$(jq 'length' <<<"$invalid_lifecycle")" -gt 0 ]; then
            echo '::error title=Invalid issue lifecycle::An open issue has multiple lifecycle labels; no issue was selected.'
            write_no_selection
            echo "selection=blocked reason=multiple-lifecycle-labels details=$(jq -c . <<<"$invalid_lifecycle")" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          blocking_states="$(jq -r '
            [ .[] |
              select(.states | any(. == "agent:claimed" or
                                    . == "agent:review-pending" or
                                    . == "agent:awaiting-merge")) |
              .number
            ] | sort | join(",")
          ' <<<"$queue_states")"
          if [ -n "$blocking_states" ]; then
            write_no_selection
            echo "selection=no-work reason=active-work blockers=${blocking_states}" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          selected="$(jq -r '[.[] | select(.states == ["agent:ready"])] | sort_by(.number) | .[0].number // empty' <<<"$queue_states")"
          if [ -z "$selected" ]; then
            write_no_selection
            echo 'selection=no-work' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$selected" in
            ''|*[!0-9]*)
              echo "::error title=Invalid selected issue::The issue selector returned a non-numeric value."
              exit 1
              ;;
          esac

          base_ref="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name // empty')"
          if [ "$base_ref" != "main" ]; then
            echo "::error title=Unexpected protected branch::The repository default branch must be main, got ${base_ref:-empty}."
            exit 1
          fi
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${base_ref}" --jq '.object.sha')"
          if ! [[ "$base_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=Invalid base SHA::The current default branch ref did not return one 40-hex commit."
            exit 1
          fi

          {
            echo 'selected=true'
            echo "issue=$selected"
            echo "base_ref=$base_ref"
            echo "base_sha=$base_sha"
          } >>"$GITHUB_OUTPUT"
          echo "selection=issue-${selected} base=${base_ref}@${base_sha}" >>"$GITHUB_STEP_SUMMARY"

  issue-cloud:
    name: Execute issue task in Codex Cloud
    needs: select-issue
    if: github.repository == 'nerdchanii/rpm' && needs.select-issue.outputs.selected == 'true'
    runs-on: ubuntu-latest
    environment: codex-cloud-issue
    permissions:
      contents: read
      issues: read
    timeout-minutes: 350
    concurrency:
      group: codex-cloud-issue-${{ github.repository }}
      cancel-in-progress: false
    env:
      CLOUD_ARTIFACT_NAME: codex-cloud-issue-${{ github.run_id }}-${{ github.run_attempt }}
      ISSUE_NUMBER: ${{ needs.select-issue.outputs.issue }}
      BASE_REF: ${{ needs.select-issue.outputs.base_ref }}
      BASE_SHA: ${{ needs.select-issue.outputs.base_sha }}
    steps:
      - name: Install pinned Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_root="${RUNNER_TEMP}/codex-cloud-cli"
          mkdir -p "$cli_root"
          npm install \
            --prefix "$cli_root" \
            --no-save \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "@openai/codex@0.152.0"
          codex_bin="${cli_root}/node_modules/.bin/codex"
          [ -x "$codex_bin" ]
          "$codex_bin" --version
          echo "CODEX_BIN=$codex_bin" >>"$GITHUB_ENV"

      - name: Submit, poll, and download issue Cloud diff
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CODEX_CLOUD_ENV_ID: ${{ vars.CODEX_CLOUD_ISSUE_ENV_ID }}
          EXPECTED_CLOUD_LANE: issue
        run: |
          set -euo pipefail

          case "$ISSUE_NUMBER" in ''|*[!0-9]*) echo '::error title=Invalid issue::The selected issue number is invalid.'; exit 1;; esac
          if [ "$BASE_REF" != main ] || ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error title=Invalid issue base::Issue Cloud work must start from main at the exact selected SHA.'
            exit 1
          fi
          if [ -z "${CODEX_CLOUD_ENV_ID:-}" ]; then echo '::error title=Missing issue Cloud environment ID::Set CODEX_CLOUD_ISSUE_ENV_ID.'; exit 1; fi
          if [ -z "${CODEX_ACCESS_TOKEN:-}" ]; then echo '::error title=Missing issue Cloud token::Set CODEX_ACCESS_TOKEN in codex-cloud-issue.'; exit 1; fi
          current_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}" --jq '.object.sha')"
          [ "$current_base_sha" = "$BASE_SHA" ] || { echo '::error title=Issue base changed::The selected main SHA changed before Cloud submission.'; exit 1; }
          current_issue="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels)"
          jq -e '
            .state == "OPEN" and
            ([.labels[] | .name] | sort | map(select(startswith("agent:")))) == ["agent:ready"]
          ' <<<"$current_issue" >/dev/null || { echo '::error title=Issue eligibility changed::The selected issue is no longer exactly ready.'; exit 1; }
          unset GH_TOKEN GITHUB_TOKEN

          prompt='Cloud preflight: RPM_CLOUD_LANE must equal issue exactly. If it is missing or has another value, return blocked and perform no mutation.

          Run the $take-ticket scheduled skill. The GitHub Action selected issue #'
          prompt+="${ISSUE_NUMBER}"
          prompt+=' as a hint only. Re-read the complete queue, enforce the claimed, review-pending, and awaiting-merge blockers and issue-number order, and perform the compare-and-set claim before acting. Keep the execution batch limit at 1. Follow-up issues are capped at 5 per source. Do not merge or perform any merge operation.

          This Cloud task starts from the exact immutable base commit below. Do not change the base or use another branch/ref:
          base_ref='
          prompt+="${BASE_REF}"
          prompt+=" base_sha=${BASE_SHA}."
          prompt+=' Finish by asking rpm_cloud_result_writer to write exactly one root file named .codex-cloud-result.json. The file is the Action handoff and must include lane=issue, issue, base_sha, status, summary, validation, next_state, and any follow-up/thread data. Do not commit, push, create/update a PR, or resolve review threads in Cloud. Do not change final lifecycle labels in Cloud: the trusted Action publisher owns normal claimed-to-review-pending and other successful final transitions. The sole exception is the take-ticket contract for a policy-checked malformed-ready candidate: after verifying the candidate ready-transition actor and compare-and-set conditions, perform only the prescribed agent:ready to agent:blocked quarantine, preserve ordinary labels, refetch, and stop. Do not select a replacement issue or retry that demotion.'
          prompt+=$'\n\nFixed dispatcher inputs: '
          prompt+="dispatcher_run_id=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}, event_id=github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:issue. The claim lease run_id and ledger run_id must equal dispatcher_run_id exactly, and the ledger event_id must equal this event_id exactly. Treat these values as fixed idempotency inputs."

          output_log="${RUNNER_TEMP}/codex-cloud-submit.log"
          if ! "$CODEX_BIN" cloud exec --env "$CODEX_CLOUD_ENV_ID" --branch "$BASE_SHA" --attempts 1 "$prompt" >"$output_log" 2>&1; then echo '::error title=Codex Cloud submission failed::The issue task could not be submitted.'; exit 1; fi
          task_url="$(grep -Eo 'https://chatgpt\.com/codex/tasks/[^/?#[:space:]]+' "$output_log" | tail -n 1)"
          if [[ ! "$task_url" =~ ^https://chatgpt\.com/codex/tasks/([A-Za-z0-9._~-]+)$ ]]; then echo '::error title=Invalid Codex Cloud response::The issue submission returned no valid task URL.'; exit 1; fi
          task_id="${BASH_REMATCH[1]}"
          task_status=pending
          poll_count=0
          missing_polls=0
          while [ "$poll_count" -lt 600 ]; do
            poll_count=$((poll_count + 1))
            if ! tasks_json="$($CODEX_BIN cloud list --json --env "$CODEX_CLOUD_ENV_ID" --limit 20)"; then echo '::error title=Codex Cloud status failed::The issue task status could not be read.'; exit 1; fi
            if ! jq -e 'type == "object" and (.tasks | type == "array")' <<<"$tasks_json" >/dev/null; then echo '::error title=Invalid Codex Cloud status::The task list response is invalid.'; exit 1; fi
            observed="$(jq -r --arg id "$task_id" '[.tasks[] | select(.id == $id) | .status][0] // empty' <<<"$tasks_json")"
            case "$observed" in
              ready|applied) task_status="$observed"; break;;
              error) echo '::error title=Codex Cloud task failed::The issue task ended with an error.'; exit 1;;
              pending) task_status=pending; missing_polls=0;;
              '') missing_polls=$((missing_polls + 1)); task_status=pending-index; if [ "$missing_polls" -ge 10 ]; then echo '::error title=Codex Cloud task missing::The issue task disappeared from status results.'; exit 1; fi;;
              *) echo '::error title=Unknown Codex Cloud status::The issue task returned an unsupported status.'; exit 1;;
            esac
            sleep 30
          done
          if [ "$task_status" != ready ] && [ "$task_status" != applied ]; then echo '::error title=Codex Cloud task timed out::The issue task did not finish within five hours.'; exit 1; fi
          raw_diff="${RUNNER_TEMP}/${CLOUD_ARTIFACT_NAME}.patch"
          if ! "$CODEX_BIN" cloud diff --attempt 1 "$task_id" >"$raw_diff"; then echo '::error title=Codex Cloud diff failed::The completed issue task did not provide a diff.'; exit 1; fi
          [ -s "$raw_diff" ] || { echo '::error title=Empty Codex Cloud diff::The issue task must return its result handoff file.'; exit 1; }
          {
            echo '## Codex Cloud issue task'
            echo
            echo "task_status: ${task_status}"
            echo "task_url: ${task_url}"
            echo "base: ${BASE_REF}@${BASE_SHA}"
            echo "artifact: ${CLOUD_ARTIFACT_NAME}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload immutable issue Cloud diff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.CLOUD_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.CLOUD_ARTIFACT_NAME }}.patch
          if-no-files-found: error
          retention-days: 1

  issue-publish:
    name: Publish validated issue result
    needs: [select-issue, issue-cloud]
    if: github.repository == 'nerdchanii/rpm' && needs.issue-cloud.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 30
    concurrency:
      group: codex-cloud-issue-publisher-${{ github.repository }}
      cancel-in-progress: false
    env:
      CLOUD_ARTIFACT_NAME: codex-cloud-issue-${{ github.run_id }}-${{ github.run_attempt }}
      ISSUE_NUMBER: ${{ needs.select-issue.outputs.issue }}
      BASE_REF: ${{ needs.select-issue.outputs.base_ref }}
      BASE_SHA: ${{ needs.select-issue.outputs.base_sha }}
    steps:
      - name: Check out exact Cloud base commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.select-issue.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted Cloud publisher tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.select-issue.outputs.base_sha }}
          path: rpm-cloud-tools
          sparse-checkout: |
            .agents/workflows/backlog-policy.json
            scripts
          persist-credentials: false
      - name: Verify trusted issue publisher revision
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$BASE_SHA" ]
          [ "$(git -C "$GITHUB_WORKSPACE/rpm-cloud-tools" rev-parse HEAD)" = "$BASE_SHA" ] || {
            echo '::error title=Untrusted issue publisher revision::Issue tools must come from the selected protected main SHA.'
            exit 1
          }
          mv "$GITHUB_WORKSPACE/rpm-cloud-tools" "${RUNNER_TEMP}/rpm-cloud-tools"
      - name: Download issue Cloud diff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.CLOUD_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/codex-cloud-issue
      - name: Validate untrusted Cloud diff
        env:
          PATCH_FILE: ${{ runner.temp }}/codex-cloud-issue/${{ env.CLOUD_ARTIFACT_NAME }}.patch
          VALIDATED_PATCH: ${{ runner.temp }}/codex-cloud-issue/validated.patch
          RESULT_FILE: ${{ runner.temp }}/codex-cloud-issue/result.json
        run: |
          set -euo pipefail
          test -f "$PATCH_FILE"
          bash "${RUNNER_TEMP}/rpm-cloud-tools/scripts/validate-cloud-diff.sh" \
            --patch "$PATCH_FILE" \
            --lane issue \
            --expected-issue "$ISSUE_NUMBER" \
            --expected-base-sha "$BASE_SHA" \
            --result-out "$RESULT_FILE" \
            --code-patch-out "$VALIDATED_PATCH"
      - name: Publish issue branch, PR, and lifecycle state
        env:
          GH_TOKEN: ${{ secrets.RPM_AUTOMATION_GITHUB_TOKEN }}
          PATCH_FILE: ${{ runner.temp }}/codex-cloud-issue/validated.patch
          RESULT_FILE: ${{ runner.temp }}/codex-cloud-issue/result.json
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo '::error title=Missing automation publisher token::Set RPM_AUTOMATION_GITHUB_TOKEN before publishing issue work.'; exit 1; }
          gh auth setup-git
          bash "${RUNNER_TEMP}/rpm-cloud-tools/scripts/publish-cloud-diff.sh" \
            --mode issue \
            --result "$RESULT_FILE" \
            --patch "$PATCH_FILE" \
            --expected-issue "$ISSUE_NUMBER" \
            --expected-base-sha "$BASE_SHA" \
            --run-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

  issue-recover:
    name: Recover failed issue run safely
    needs: [select-issue, issue-cloud, issue-publish]
    if: >-
      ${{ always() && github.repository == 'nerdchanii/rpm' &&
          needs.select-issue.outputs.selected == 'true' &&
          (needs.issue-cloud.result == 'failure' || needs.issue-cloud.result == 'cancelled' ||
           needs.issue-publish.result == 'failure' || needs.issue-publish.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    concurrency:
      group: codex-cloud-issue-recovery-${{ github.repository }}
      cancel-in-progress: false
    env:
      ISSUE_NUMBER: ${{ needs.select-issue.outputs.issue }}
    steps:
      - name: Block only the exact failed claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) echo '::error title=Invalid recovery issue::The selected issue number is invalid.'; exit 1;; esac
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) echo '::error title=Invalid recovery run::The Action run id is invalid.'; exit 1;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) echo '::error title=Invalid recovery attempt::The Action run attempt is invalid.'; exit 1;; esac
          issue_json="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,state,body,labels,comments)"
          if ! jq -e '
            .state == "OPEN" and
            ([.labels[] | .name] as $labels |
              ($labels | map(select(startswith("agent:")))) == ["agent:claimed"])
          ' <<<"$issue_json" >/dev/null; then
            echo '::error title=Recovery ownership unavailable::The issue is no longer exactly open and claimed; no state was changed.'
            exit 1
          fi
          marker_count="$(jq -r '[.body // "" | split("\n")[] | select(test("^\\s*<!--\\s*rpm-agent-execution:\\s*\\{.*\\}\\s*-->\\s*$"))] | length' <<<"$issue_json")"
          [ "$marker_count" = 1 ] || { echo '::error title=Recovery marker unavailable::The issue claim marker is missing or ambiguous; no state was changed.'; exit 1; }
          marker_json="$(jq -r '[.body // "" | split("\n")[] | select(test("^\\s*<!--\\s*rpm-agent-execution:\\s*\\{.*\\}\\s*-->\\s*$"))] | .[0] | capture("^\\s*<!--\\s*rpm-agent-execution:\\s*(?<json>\\{.*\\})\\s*-->\\s*$").json' <<<"$issue_json")"
          dispatcher_run_id="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          event_id="github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:issue"
          if ! jq -e '
            type == "object" and
            (.approval_id | type == "string" and length > 0) and
            (.plan_revision | type == "string" and length > 0) and
            (.scope_hash | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
            (.executor | type == "string" and . == "cloud") and
            (.lease | type == "object" and
              (.run_id | type == "string" and length > 0) and
              (.owner | type == "string" and length > 0) and
              (.expires_at | type == "string" and length > 0)) and
            (.runs | type == "array" and all(.[];
              type == "object" and
              (.repository | type == "string" and length > 0) and
              (.issue | type == "number" and floor == . and . > 0) and
              (.plan_revision | type == "string" and length > 0) and
              (.scope_hash | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
              (.event_id | type == "string" and length > 0) and
              (.idempotency_key | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
              (.run_id | type == "string" and length > 0) and
              (.status | type == "string" and . == "active")
            ))
          ' <<<"$marker_json" >/dev/null 2>&1; then
            echo '::error title=Recovery ownership unavailable::The claim marker metadata, lease, or run ledger is malformed; no state was changed.'
            exit 1
          fi
          if ! jq -e --arg run_id "$dispatcher_run_id" --arg event "$event_id" '
            (.lease.run_id == $run_id) and
            (.lease.owner | type == "string" and startswith("cloud:")) and
            (.runs | ([.[] | .idempotency_key] | length == (unique | length))) and
            (.runs | ([.[] | .event_id] | length == (unique | length))) and
            (.runs | ([.[] | .run_id] | length == (unique | length))) and
            (.runs | any(.[]; .run_id == $run_id and .event_id == $event))
          ' <<<"$marker_json" >/dev/null 2>&1; then
            echo '::error title=Recovery ownership unavailable::The claim marker has no unique matching Cloud event for this run; no state was changed.'
            exit 1
          fi
          plan_revision="$(jq -er '.plan_revision' <<<"$marker_json")" || {
            echo '::error title=Recovery ownership unavailable::The claim plan revision is missing; no state was changed.'
            exit 1
          }
          scope_hash="$(jq -er '.scope_hash' <<<"$marker_json")" || {
            echo '::error title=Recovery ownership unavailable::The claim scope hash is missing; no state was changed.'
            exit 1
          }
          expected_key="$(python3 - "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "$plan_revision" "$scope_hash" "$event_id" <<'PY'
          import hashlib
          import sys

          print("sha256:" + hashlib.sha256("\0".join(sys.argv[1:]).encode("utf-8")).hexdigest())
          PY
          )" || {
            echo '::error title=Recovery ownership unavailable::The claim idempotency key could not be calculated; no state was changed.'
            exit 1
          }
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --argjson issue "$ISSUE_NUMBER" \
            --arg plan_revision "$plan_revision" --arg scope_hash "$scope_hash" \
            --arg run_id "$dispatcher_run_id" --arg event "$event_id" --arg expected_key "$expected_key" '
            (.runs |
              ([.[] | select(.run_id == $run_id)] | length == 1) and
              ([.[] | select(.event_id == $event)] | length == 1) and
              ([.[] | select(.idempotency_key == $expected_key)] | length == 1) and
              ([.[] | select(.run_id == $run_id)] | .[0] ==
                {repository:$repo,issue:$issue,plan_revision:$plan_revision,
                 scope_hash:$scope_hash,event_id:$event,
                 idempotency_key:$expected_key,run_id:$run_id,status:"active"}))
          ' <<<"$marker_json" >/dev/null 2>&1; then
            echo '::error title=Recovery ownership unavailable::The claim does not contain the exact current run tuple; no state was changed.'
            exit 1
          fi
          expires_at="$(jq -er '.lease.expires_at | select(type == "string")' <<<"$marker_json")" || {
            echo '::error title=Recovery lease unavailable::The claim lease expiry is missing; no state was changed.'
            exit 1
          }
          if lease_check="$(python3 - "$expires_at" 2>/dev/null <<'PY'
          import datetime
          import re
          import sys

          value = sys.argv[1]
          if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})", value) is None:
              raise SystemExit(1)
          try:
              normalized = value[:-1] + "+00:00" if value.endswith("Z") else value
              expires = datetime.datetime.fromisoformat(normalized)
          except ValueError:
              raise SystemExit(1)
          if expires.tzinfo is None:
              raise SystemExit(1)
          if expires <= datetime.datetime.now(datetime.timezone.utc):
              print("expired")
          else:
              print("future")
          PY
          )"; then
            case "$lease_check" in
              future|expired) ;;
              *)
              echo '::error title=Recovery lease unavailable::The claim lease expiry is invalid; no state was changed.'
              exit 1
              ;;
            esac
          else
            echo '::error title=Recovery lease unavailable::The claim lease expiry is invalid; no state was changed.'
            exit 1
          fi
          ordinary_before="$(jq -c '[.labels[] | .name | select(startswith("agent:") | not)] | sort' <<<"$issue_json")"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label agent:claimed --add-label agent:blocked >/dev/null
          issue_after="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,state,body,labels,comments)"
          jq -e '[.labels[] | .name] as $labels | .state == "OPEN" and ($labels | map(select(startswith("agent:")))) == ["agent:blocked"]' <<<"$issue_after" >/dev/null || { echo '::error title=Recovery verification failed::The blocked state could not be verified.'; exit 1; }
          ordinary_after="$(jq -c '[.labels[] | .name | select(startswith("agent:") | not)] | sort' <<<"$issue_after")"
          [ "$ordinary_before" = "$ordinary_after" ] || { echo '::error title=Recovery label preservation failed::An ordinary label changed unexpectedly.'; exit 1; }
          recovery_marker="<!-- rpm-agent-cloud-recovery: issue=${ISSUE_NUMBER};run=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT} -->"
          if ! jq -e --arg marker "$recovery_marker" 'any(.comments[]?; ((.body // .) | type == "string" and contains($marker)))' <<<"$issue_after" >/dev/null; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "${recovery_marker} Codex Cloud failed before the Action publisher completed. The claim was moved to agent:blocked for manual inspection. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi
          comments_after="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments)" || { echo '::error title=Recovery comment verification failed::The recovery comment could not be read back.'; exit 1; }
          jq -e --arg marker "$recovery_marker" 'any(.comments[]?; ((.body // .) | type == "string" and contains($marker)))' <<<"$comments_after" >/dev/null || { echo '::error title=Recovery comment verification failed::The deduplicated recovery marker was not found after the state transition.'; exit 1; }
          echo "recovery=blocked issue=${ISSUE_NUMBER} reason=cloud-or-publisher-failure" >>"$GITHUB_STEP_SUMMARY"

  select-review:
    name: Select one pending review and exact PR head
    if: >-
      ${{ github.repository == 'nerdchanii/rpm' &&
          ((github.event_name == 'repository_dispatch' &&
            github.actor == 'nerdchanii' &&
            github.ref == 'refs/heads/main' &&
            (github.event.client_payload.lane == 'all' ||
             github.event.client_payload.lane == 'review')) ||
           (vars.CODEX_CLOUD_AUTOMATION_ENABLED == 'true' &&
            (github.event_name == 'schedule' ||
             github.event_name == 'workflow_run'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: codex-cloud-review-selector-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      issue: ${{ steps.select.outputs.issue }}
      base_ref: ${{ steps.select.outputs.base_ref }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      pr: ${{ steps.select.outputs.pr }}
      head_ref: ${{ steps.select.outputs.head_ref }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      correction_limit_exhausted: ${{ steps.select.outputs.correction_limit_exhausted }}
      terminal_issue: ${{ steps.select.outputs.terminal_issue }}
      terminal_pr: ${{ steps.select.outputs.terminal_pr }}
      terminal_base_ref: ${{ steps.select.outputs.terminal_base_ref }}
      terminal_base_sha: ${{ steps.select.outputs.terminal_base_sha }}
      terminal_head_ref: ${{ steps.select.outputs.terminal_head_ref }}
      terminal_head_sha: ${{ steps.select.outputs.terminal_head_sha }}
      terminal_reason: ${{ steps.select.outputs.terminal_reason }}
    steps:
      - id: select
        name: Resolve exactly one same-repository open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          write_no_selection() {
            printf '%s\n' \
              'selected=false' 'issue=' 'pr=' 'base_ref=' 'base_sha=' \
              'head_ref=' 'head_sha=' 'correction_limit_exhausted=false' \
              'terminal_issue=' 'terminal_pr=' 'terminal_base_ref=' \
              'terminal_base_sha=' 'terminal_head_ref=' 'terminal_head_sha=' \
              'terminal_reason=' >>"$GITHUB_OUTPUT"
            echo 'selection=no-work' >>"$GITHUB_STEP_SUMMARY"
          }

          # The review selector can be invoked independently of the issue
          # selector. Re-read the complete open lifecycle queue so a stale or
          # manually triggered lane cannot start work while two issues are
          # already in flight.
          queue_json="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 1000 \
            --json number,labels)"
          jq -e '
            type == "array" and
            all(.[]; type == "object" and
              (.number | type == "number" and floor == . and . > 0) and
              (.labels | type == "array" and
                all(.[]; type == "object" and (.name | type == "string"))))
          ' <<<"$queue_json" >/dev/null || {
            echo '::error title=Invalid issue queue::The open issue response is malformed.'
            write_no_selection
            exit 1
          }
          if [ "$(jq 'length' <<<"$queue_json")" -ge 1000 ]; then
            echo '::error title=Incomplete issue queue::The open issue inventory reached the 1000-item limit and may be truncated; no review was selected.'
            write_no_selection
            echo 'selection=blocked reason=issue-inventory-may-be-truncated' >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          queue_states="$(jq -c '
            map({
              number,
              states: [ .labels[]?.name | select(
                . == "agent:research" or
                . == "agent:ready" or
                . == "agent:claimed" or
                . == "agent:review-pending" or
                . == "agent:awaiting-merge" or
                . == "agent:blocked"
              ) ] | sort
            })
          ' <<<"$queue_json")"
          invalid_lifecycle="$(jq -c '[.[] | select((.states | length) > 1)]' <<<"$queue_states")"
          if [ "$(jq 'length' <<<"$invalid_lifecycle")" -gt 0 ]; then
            echo '::error title=Invalid issue lifecycle::An open issue has multiple lifecycle labels; no review was selected.'
            write_no_selection
            echo "selection=blocked reason=multiple-lifecycle-labels details=$(jq -c . <<<"$invalid_lifecycle")" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          active_issues="$(jq -c '[.[] | select(.states | any(. == "agent:claimed" or . == "agent:review-pending" or . == "agent:awaiting-merge"))]' <<<"$queue_states")"
          if [ "$(jq 'length' <<<"$active_issues")" -gt 1 ]; then
            active_numbers="$(jq -r '[.[] | .number] | sort | join(",")' <<<"$active_issues")"
            write_no_selection
            echo "selection=no-work reason=active-work blockers=${active_numbers}" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          issues_json="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label 'agent:review-pending' --limit 1000 --json number)"
          jq -e '
            type == "array" and
            all(.[]; type == "object" and
              (.number | type == "number" and floor == . and . > 0))
          ' <<<"$issues_json" >/dev/null || {
            echo '::error title=Invalid review issue list::The review-pending issue response is malformed.'
            write_no_selection
            exit 1
          }
          if [ "$(jq 'length' <<<"$issues_json")" -ge 1000 ]; then
            echo '::error title=Incomplete review issue list::The review-pending issue inventory reached the 1000-item limit and may be truncated; no review was selected.'
            write_no_selection
            echo 'selection=blocked reason=issue-inventory-may-be-truncated' >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          issue_numbers="$(jq -r 'sort_by(.number) | .[].number' <<<"$issues_json")"
          protected_review_path() {
            case "$1" in
              .agents|.agents/*|.codex|.codex/*|.github|.github/*|.githooks|.githooks/*|.cargo|.cargo/*|\
              AGENTS.md|*/AGENTS.md|clippy.toml|justfile|rust-toolchain|rust-toolchain.toml|rustfmt.toml|.rustfmt.toml|\
              scripts/agent-loop-*|scripts/check-agent-*|scripts/check-cloud-*|scripts/check-merge-*|scripts/check-workflow-*|\
              scripts/collect-pr-review-context*|scripts/collect-merge-gate-evidence*|scripts/create-review-followup-issue*|\
              scripts/publish-cloud-diff*|scripts/publish-cloud-merge*|scripts/quarantine-merge-selector-anomaly*|\
              scripts/quarantine-review-correction-limit*|\
              scripts/safe-direct-merge*|scripts/validate-agent-workflow-assets*|scripts/validate-cloud-diff*|scripts/test-*|\
              scripts/setup-codex-cloud-lane.sh|scripts/codex-cloud-setup.sh|scripts/codex-rust-analyzer.sh|\
              scripts/install-git-hooks.sh|scripts/run-local-git-hook-gate.sh|scripts/worktree-setup.sh|scripts/worktree-cleanup.sh)
                return 0
                ;;
            esac
            return 1
          }
          protected_base_ref="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name // empty')"
          if [ "$protected_base_ref" != main ]; then echo "::error title=Unexpected protected branch::The repository default branch must be main, got ${protected_base_ref:-empty}."; exit 1; fi
          dispatch_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${protected_base_ref}" --jq '.object.sha')"
          if ! [[ "$dispatch_base_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then echo '::error title=Invalid base SHA::The current default branch ref did not return one 40-hex commit.'; exit 1; fi
          write_terminal_selection() {
            local reason="$1"
            {
              echo 'selected=false'
              echo "issue=$issue_number"
              echo "pr=$pr_number"
              echo "base_ref=$base_ref"
              echo "base_sha=$dispatch_base_sha"
              echo "head_ref=$head_ref"
              echo "head_sha=$head_sha"
              echo 'correction_limit_exhausted=true'
              echo "terminal_issue=$issue_number"
              echo "terminal_pr=$pr_number"
              echo "terminal_base_ref=$base_ref"
              echo "terminal_base_sha=$dispatch_base_sha"
              echo "terminal_head_ref=$head_ref"
              echo "terminal_head_sha=$head_sha"
              echo "terminal_reason=$reason"
            } >>"$GITHUB_OUTPUT"
          }
          closing_references_failure_reason=''
          closing_issue_references_json=''
          read_closing_issue_references() {
            local target_pr="$1"
            local pages_file="${RUNNER_TEMP}/rpm-review-closing-references-${target_pr}.jsonl"
            local cursors_file="${RUNNER_TEMP}/rpm-review-closing-reference-cursors-${target_pr}.txt"
            local query response page_count=0 reference_count=0 page_reference_count has_next next_cursor
            local max_pages=100 max_references=10000
            local cursor=''
            local -a gh_args
            closing_references_failure_reason=''
            closing_issue_references_json=''
            [[ "$target_pr" =~ ^[1-9][0-9]*$ ]] || { closing_references_failure_reason='pr-invalid'; return 1; }
            : >"$pages_file" || { closing_references_failure_reason='temporary-file-failed'; return 1; }
            : >"$cursors_file" || { closing_references_failure_reason='temporary-file-failed'; return 1; }
            query='query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){nameWithOwner,pullRequest(number:$number){number,repository{nameWithOwner},closingIssuesReferences(first:100,after:$after){pageInfo{hasNextPage,endCursor},nodes{id,number,repository{nameWithOwner}}}}}}'
            while :; do
              page_count=$((page_count + 1))
              [ "$page_count" -le "$max_pages" ] || { closing_references_failure_reason='pagination-limit'; return 1; }
              if [ -n "$cursor" ]; then
                if grep -Fqx -- "$cursor" "$cursors_file"; then
                  closing_references_failure_reason='pagination-cursor-repeat'
                  return 1
                fi
                case "$cursor" in *$'\n'*|*$'\r'*) closing_references_failure_reason='pagination-cursor-invalid'; return 1 ;; esac
                printf '%s\n' "$cursor" >>"$cursors_file" || { closing_references_failure_reason='temporary-file-failed'; return 1; }
              fi
              gh_args=(api graphql -f query="$query" \
                -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$target_pr")
              [ -z "$cursor" ] || gh_args+=(-f after="$cursor")
              if ! response="$(GH_REPO="$GITHUB_REPOSITORY" gh "${gh_args[@]}")"; then
                closing_references_failure_reason='read-failed'
                return 1
              fi
              jq -e --arg repo "$GITHUB_REPOSITORY" --argjson pr "$target_pr" '
                type == "object" and
                (.errors? == null) and
                (.data | type == "object") and
                (.data.repository | type == "object") and
                (.data.repository.nameWithOwner == $repo) and
                (.data.repository.pullRequest | type == "object") and
                (.data.repository.pullRequest.number == $pr) and
                (.data.repository.pullRequest.repository | type == "object") and
                (.data.repository.pullRequest.repository.nameWithOwner == $repo) and
                (.data.repository.pullRequest.closingIssuesReferences | type == "object") and
                (.data.repository.pullRequest.closingIssuesReferences.pageInfo | type == "object") and
                (.data.repository.pullRequest.closingIssuesReferences.pageInfo.hasNextPage | type == "boolean") and
                (.data.repository.pullRequest.closingIssuesReferences.pageInfo | has("endCursor")) and
                ((.data.repository.pullRequest.closingIssuesReferences.pageInfo.endCursor == null) or
                 (.data.repository.pullRequest.closingIssuesReferences.pageInfo.endCursor | type == "string" and length > 0)) and
                (.data.repository.pullRequest.closingIssuesReferences.nodes | type == "array" and length <= 100 and all(.[];
                  type == "object" and
                  (.id | type == "string" and length > 0) and
                  (.number | type == "number" and floor == . and . > 0) and
                  (.repository | type == "object") and
                  (.repository.nameWithOwner | type == "string" and test("^[^/]+/[^/]+$"))
                ))
              ' <<<"$response" >/dev/null 2>&1 || {
                closing_references_failure_reason='response-invalid'
                return 1
              }
              printf '%s\n' "$response" >>"$pages_file" || { closing_references_failure_reason='temporary-file-failed'; return 1; }
              page_reference_count="$(jq -er '.data.repository.pullRequest.closingIssuesReferences.nodes | length' <<<"$response")" || {
                closing_references_failure_reason='response-invalid'
                return 1
              }
              reference_count=$((reference_count + page_reference_count))
              [ "$reference_count" -le "$max_references" ] || { closing_references_failure_reason='reference-limit'; return 1; }
              jq -s -e '
                [.[].data.repository.pullRequest.closingIssuesReferences.nodes[]] as $nodes |
                ([ $nodes[].id ] | length) == ([ $nodes[].id ] | unique | length) and
                ([ $nodes[] | (.repository.nameWithOwner + "#" + (.number | tostring)) ] | length) ==
                  ([ $nodes[] | (.repository.nameWithOwner + "#" + (.number | tostring)) ] | unique | length)
              ' "$pages_file" >/dev/null 2>&1 || {
                closing_references_failure_reason='pagination-duplicate-id'
                return 1
              }
              has_next="$(jq -r '.data.repository.pullRequest.closingIssuesReferences.pageInfo.hasNextPage' <<<"$response")" || {
                closing_references_failure_reason='response-invalid'
                return 1
              }
              case "$has_next" in true|false) ;; *) closing_references_failure_reason='response-invalid'; return 1 ;; esac
              next_cursor="$(jq -r '.data.repository.pullRequest.closingIssuesReferences.pageInfo.endCursor // empty' <<<"$response")" || {
                closing_references_failure_reason='response-invalid'
                return 1
              }
              if [ "$has_next" = true ]; then
                [ -n "$next_cursor" ] || { closing_references_failure_reason='pagination-cursor-invalid'; return 1; }
                [ "$next_cursor" != "$cursor" ] || { closing_references_failure_reason='pagination-cursor-stalled'; return 1; }
                cursor="$next_cursor"
              else
                break
              fi
            done
            closing_issue_references_json="$(jq -s -c '[.[].data.repository.pullRequest.closingIssuesReferences.nodes[] | {id,number,repository:{nameWithOwner:.repository.nameWithOwner}}]' "$pages_file" 2>/dev/null)" || {
              closing_references_failure_reason='normalization-failed'
              return 1
            }
            jq -e 'type == "array" and all(.[]; type == "object" and (.id | type == "string" and length > 0) and (.number | type == "number" and floor == . and . > 0) and (.repository.nameWithOwner | type == "string" and test("^[^/]+/[^/]+$")))' \
              <<<"$closing_issue_references_json" >/dev/null 2>&1 || {
              closing_references_failure_reason='normalization-failed'
              return 1
            }
          }
          review_comments_failure_reason=''
          read_review_issue_comments() {
            local target_issue="$1"
            local pages_file="${RUNNER_TEMP}/rpm-review-correction-comments-${target_issue}.jsonl"
            local cursors_file="${RUNNER_TEMP}/rpm-review-correction-cursors-${target_issue}.txt"
            local query response page_count=0 comment_count=0 page_comment_count has_next next_cursor
            local cursor=''
            local -a gh_args
            review_comments_failure_reason=''
            [[ "$target_issue" =~ ^[1-9][0-9]*$ ]] || { review_comments_failure_reason='issue-invalid'; return 1; }
            : >"$pages_file" || { review_comments_failure_reason='temporary-file-failed'; return 1; }
            : >"$cursors_file" || { review_comments_failure_reason='temporary-file-failed'; return 1; }
            query='query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){nameWithOwner,issue(number:$number){number,repository{nameWithOwner},comments(first:100,after:$after){pageInfo{hasNextPage,endCursor},nodes{id,body,author{login}}}}}}'
            while :; do
              page_count=$((page_count + 1))
              [ "$page_count" -le 100 ] || { review_comments_failure_reason='pagination-limit'; return 1; }
              if [ -n "$cursor" ]; then
                if grep -Fqx -- "$cursor" "$cursors_file"; then
                  review_comments_failure_reason='pagination-cursor-repeat'
                  return 1
                fi
                case "$cursor" in *$'\n'*|*$'\r'*) review_comments_failure_reason='pagination-cursor-invalid'; return 1 ;; esac
                printf '%s\n' "$cursor" >>"$cursors_file" || { review_comments_failure_reason='temporary-file-failed'; return 1; }
              fi
              gh_args=(api graphql -f query="$query" \
                -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$target_issue")
              [ -z "$cursor" ] || gh_args+=(-f after="$cursor")
              if ! response="$(GH_REPO="$GITHUB_REPOSITORY" gh "${gh_args[@]}")"; then
                review_comments_failure_reason='read-failed'
                return 1
              fi
              jq -e --arg repo "$GITHUB_REPOSITORY" --argjson issue "$target_issue" '
                type == "object" and
                (.errors? == null) and
                (.data | type == "object") and
                (.data.repository | type == "object") and
                (.data.repository.nameWithOwner == $repo) and
                (.data.repository.issue | type == "object") and
                (.data.repository.issue.number == $issue) and
                (.data.repository.issue.repository | type == "object") and
                (.data.repository.issue.repository.nameWithOwner == $repo) and
                (.data.repository.issue.comments | type == "object") and
                (.data.repository.issue.comments.pageInfo | type == "object") and
                (.data.repository.issue.comments.pageInfo.hasNextPage | type == "boolean") and
                (.data.repository.issue.comments.pageInfo | has("endCursor")) and
                ((.data.repository.issue.comments.pageInfo.endCursor == null) or
                 (.data.repository.issue.comments.pageInfo.endCursor | type == "string" and length > 0)) and
                (.data.repository.issue.comments.nodes | type == "array" and length <= 100 and all(.[];
                  type == "object" and
                  (.id | type == "string" and length > 0) and
                  (.body | type == "string") and
                  (has("author") and ((.author == null) or
                   (.author | type == "object" and
                    (.login | type == "string" and length > 0))))
                ))
              ' <<<"$response" >/dev/null 2>&1 || {
                review_comments_failure_reason='response-invalid'
                return 1
              }
              printf '%s\n' "$response" >>"$pages_file" || { review_comments_failure_reason='temporary-file-failed'; return 1; }
              page_comment_count="$(jq -er '.data.repository.issue.comments.nodes | length' <<<"$response")" || {
                review_comments_failure_reason='response-invalid'
                return 1
              }
              comment_count=$((comment_count + page_comment_count))
              [ "$comment_count" -le 10000 ] || { review_comments_failure_reason='comment-limit'; return 1; }
              jq -s -e '[.[].data.repository.issue.comments.nodes[].id] as $ids | ($ids | length) == ($ids | unique | length)' \
                "$pages_file" >/dev/null 2>&1 || {
                review_comments_failure_reason='pagination-duplicate-id'
                return 1
              }
              has_next="$(jq -r '.data.repository.issue.comments.pageInfo.hasNextPage' <<<"$response")" || {
                review_comments_failure_reason='response-invalid'
                return 1
              }
              case "$has_next" in true|false) ;; *) review_comments_failure_reason='response-invalid'; return 1 ;; esac
              next_cursor="$(jq -r '.data.repository.issue.comments.pageInfo.endCursor // empty' <<<"$response")" || {
                review_comments_failure_reason='response-invalid'
                return 1
              }
              if [ "$has_next" = true ]; then
                [ -n "$next_cursor" ] || { review_comments_failure_reason='pagination-cursor-invalid'; return 1; }
                [ "$next_cursor" != "$cursor" ] || { review_comments_failure_reason='pagination-cursor-stalled'; return 1; }
                cursor="$next_cursor"
              else
                break
              fi
            done
            review_issue_comments_json="$(jq -s -c '
              {comments: [.[].data.repository.issue.comments.nodes[] |
                {id,body,author:(if .author == null then null else {login:(.author.login // null)} end)}]}
            ' "$pages_file" 2>/dev/null)" || {
