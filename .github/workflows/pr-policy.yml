name: PR Metadata

on:
  pull_request:
    branches: ["main"]
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - labeled
      - unlabeled

permissions: {}

jobs:
  metadata:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Report optional PR metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail

          descriptive_labels="$(
            jq '[.[] | select(.name | startswith("agent:") | not)] | length' \
              <<< "${PR_LABELS_JSON}"
          )"

          printf 'pr_metadata.descriptive_labels=%s\n' "${descriptive_labels}"
          if [ "${descriptive_labels}" -eq 0 ]; then
            echo '::notice title=Optional PR metadata::No descriptive label is present; this does not block merge.'
          fi

          if grep -Eiq '(^|[[:space:]])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' <<< "${PR_BODY}"; then
            printf 'pr_metadata.closing_reference=present\n'
          else
            printf 'pr_metadata.closing_reference=missing\n'
            echo '::notice title=Optional PR metadata::No closing issue reference is present; this does not block merge.'
          fi

          printf 'pr_metadata.status=advisory\n'
