name: Semver Benchmarks

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/semver-benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "benches/semver.rs"
      - "benches/semver_corpus.json"
      - "benches/template/BENCHMARKS.md"
      - "scripts/benchmark-node-semver.mjs"
      - "scripts/benchmark-semver.mjs"
      - "src/core/resolver/semver/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-semver-benchmarks:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out exact pull request head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Run semver benchmarks
        run: node scripts/benchmark-semver.mjs

      - name: Require committed benchmark output
        run: git diff --exit-code -- benches/BENCHMARKS.md benches/histories

  verify-main-semver-benchmarks:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Run semver benchmarks
        run: node scripts/benchmark-semver.mjs

      - name: Require committed benchmark output
        run: git diff --exit-code -- benches/BENCHMARKS.md benches/histories
